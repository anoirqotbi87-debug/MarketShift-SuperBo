name: MarketShift SuperBot CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # caching pip dependencies
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Ne pas installer torch ni MetaTrader5 pour les tests GitHub Actions :
        #  - torch est lourd et non requis par la logique métier testée (Risk, Stratégies, ML)
        #  - MetaTrader5 est un paquet Windows-only, non installable sur runner Linux (ubuntu-latest)
        grep -vE "^(torch|MetaTrader5)" requirements.txt | pip install -r /dev/stdin
        
    - name: Test with pytest
      run: |
        pytest tests/ -v
