version: '3.8'

services:
  marketshift-backend:
    build: .
    container_name: marketshift-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_KEY=SuperSecretKey123!
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    # Optionnel: si vous avez un broker mock ou une DB, vous pouvez configurer le réseau ici.

  marketshift-frontend:
    build: ./ui
    container_name: marketshift-ui
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - marketshift-backend
