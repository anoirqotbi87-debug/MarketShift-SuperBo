version: '3.8'

services:
  marketshift-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: marketshift_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DISPLAY=:99
      - WINEPREFIX=/root/.wine
      - WINEDEBUG=-all
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - marketshift_net

  marketshift-frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile.frontend
    container_name: marketshift_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - marketshift-backend
    networks:
      - marketshift_net

networks:
  marketshift_net:
    driver: bridge
